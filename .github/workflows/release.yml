name: CI / Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci

      - name: Audit (high+)
        run: npm audit --audit-level=high

      - name: Check source file exists
        run: |
          if [ ! -f dist/ha-timeline-cards.js ]; then
            echo "dist/ha-timeline-cards.js not found"
            exit 1
          fi

      - name: Check bundle size
        run: |
          SIZE=$(wc -c < dist/ha-timeline-cards.js)
          echo "Bundle size: ${SIZE} bytes"
          if [ "$SIZE" -gt 131072 ]; then
            echo "Bundle exceeds 128 KB"
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ha-timeline-cards.js
          generate_release_notes: true
